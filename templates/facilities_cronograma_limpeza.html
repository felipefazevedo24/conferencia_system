<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Limpeza | Columbia Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--font-display:'Segoe UI',system-ui,sans-serif;--font-body:'Segoe UI',system-ui,sans-serif}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-body);background:linear-gradient(135deg,#f0f4f8 0%,#e2e8f0 100%);min-height:100vh;padding:20px}
        .shell{max-width:900px;margin:0 auto}
        .hero{background:linear-gradient(135deg,#0284c7 0%,#0ea5e9 50%,#38bdf8 100%);border-radius:24px;padding:32px;color:#fff;margin-bottom:24px;box-shadow:0 12px 40px rgba(2,132,199,.25)}
        .hero h1{font-size:32px;font-weight:800;margin-bottom:8px}
        .hero p{opacity:.9;font-size:15px}
        .filters{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 4px 12px rgba(18,40,58,.04);margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:end}
        .filter-group{flex:1;min-width:150px}
        .filter-group label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
        .filter-group input,.filter-group select{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc}
        .filter-group input:focus,.filter-group select:focus{outline:none;border-color:#0ea5e9;background:#fff}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
        .btn-primary{background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff}
        .btn-primary:hover{transform:translateY(-1px)}
        .schedule-grid{display:grid;gap:16px}
        .day-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(18,40,58,.04)}
        .day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f1f5f9}
        .day-header h2{font-size:18px;font-weight:700;color:#0f172a}
        .day-header span{font-size:13px;color:#64748b}
        .task-list{display:grid;gap:10px}
        .task-item{display:flex;align-items:center;gap:14px;padding:14px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0;transition:all .2s}
        .task-item:hover{background:#f1f5f9;border-color:#cbd5e1}
        .task-item.done{background:#f0fdf4;border-color:#bbf7d0}
        .task-item.done .task-title{text-decoration:line-through;color:#64748b}
        .task-check{width:24px;height:24px;border-radius:8px;border:2px solid #cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
        .task-check:hover{border-color:#0ea5e9;background:#eff6ff}
        .task-item.done .task-check{background:#22c55e;border-color:#22c55e;color:#fff}
        .task-info{flex:1}
        .task-title{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:2px}
        .task-meta{font-size:12px;color:#64748b}
        .task-time{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#475569;background:#e2e8f0;padding:6px 12px;border-radius:8px}
        .empty-state{text-align:center;padding:40px;color:#64748b}
        .empty-state i{font-size:48px;color:#cbd5e1;margin-bottom:16px}
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999}
        .toast{background:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 12px 40px rgba(0,0,0,.12);border-left:4px solid #0ea5e9;transform:translateX(120%);opacity:0;transition:all .3s;margin-bottom:10px}
        .toast.show{transform:translateX(0);opacity:1}
        .toast.success{border-left-color:#22c55e}
        .toast.error{border-left-color:#ef4444}
        .btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
        .btn-success:hover{transform:translateY(-1px)}
        .btn-outline{background:#fff;border:1px solid #cbd5e1;color:#334155}
        .btn-outline:hover{background:#f8fafc}
        .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:9998;padding:16px}
        .modal-backdrop.show{display:flex}
        .modal{background:#fff;border-radius:18px;padding:24px;max-width:520px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.25)}
        .modal h3{font-size:20px;font-weight:700;color:#0f172a;margin-bottom:4px}
        .modal .sub{color:#64748b;font-size:13px;margin-bottom:16px}
        .modal .form-row-m{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
        .modal label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
        .modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc}
        .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:#0ea5e9;background:#fff}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
        .foto-preview{margin-top:10px;max-width:100%;border-radius:10px;border:1px solid #e2e8f0;display:none}
        .foto-preview.show{display:block}
        .task-actions{display:flex;gap:8px}
        .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    </style>
    <link rel="stylesheet" href="/static/css/facilities_theme.css?v={{ asset_version|default('1') }}">
</head>
<body>
    <div class="shell">
        <div class="hero">
            <h1><i class="fas fa-broom"></i> Cronograma de Limpeza</h1>
            <p>Acompanhe e marque as limpezas programadas para cada dia.</p>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Data Início</label>
                <input type="date" id="dataInicio">
            </div>
            <div class="filter-group">
                <label>Data Fim</label>
                <input type="date" id="dataFim">
            </div>
            <div class="filter-group">
                <label>Responsável</label>
                <select id="selColaborador">
                    <option value="">Todos</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="carregarLimpezas()"><i class="fas fa-search"></i> Filtrar</button>
            <button id="btnNovaLimpeza" class="btn btn-success" onclick="abrirModalNova()" style="display:none"><i class="fas fa-plus"></i> Nova Limpeza</button>
        </div>

        <div id="scheduleGrid" class="schedule-grid">
            <div class="empty-state">
                <i class="fas fa-calendar-check"></i>
                <p>Selecione um período para ver o cronograma.</p>
            </div>
        </div>
    </div>

    <!-- Modal: Nova limpeza (admin) -->
    <div id="modalNova" class="modal-backdrop" onclick="if(event.target===this)fecharModal('modalNova')">
        <div class="modal">
            <h3><i class="fas fa-plus-circle"></i> Nova Limpeza</h3>
            <p class="sub">Agende uma nova tarefa de limpeza.</p>
            <div>
                <label>Título *</label>
                <input type="text" id="novaTitulo" placeholder="Ex: Limpeza sala de reuniao">
            </div>
            <div class="form-row-m" style="margin-top:12px">
                <div>
                    <label>Data *</label>
                    <input type="date" id="novaData">
                </div>
                <div>
                    <label>Responsável</label>
                    <select id="novaColaborador">
                        <option value="">-- Sem responsavel --</option>
                    </select>
                </div>
            </div>
            <div class="form-row-m">
                <div>
                    <label>Hora Início</label>
                    <input type="time" id="novaHoraInicio">
                </div>
                <div>
                    <label>Hora Fim</label>
                    <input type="time" id="novaHoraFim">
                </div>
            </div>
            <div>
                <label>Local</label>
                <input type="text" id="novaLocal" placeholder="Ex: Sala A, Banheiros, etc">
            </div>
            <div style="margin-top:12px">
                <label>Observações</label>
                <textarea id="novaObs" rows="2"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="fecharModal('modalNova')">Cancelar</button>
                <button class="btn btn-success" onclick="salvarNovaLimpeza()"><i class="fas fa-save"></i> Agendar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Concluir com foto -->
    <div id="modalConcluir" class="modal-backdrop" onclick="if(event.target===this)fecharModal('modalConcluir')">
        <div class="modal">
            <h3><i class="fas fa-camera"></i> Concluir Limpeza</h3>
            <p class="sub" id="concluirSubtitulo">Anexe uma foto como evidencia (opcional).</p>
            <div>
                <label>Foto-evidência</label>
                <input type="file" id="fotoEvidencia" accept="image/*" capture="environment" onchange="previewFoto(event)">
                <img id="fotoPreview" class="foto-preview">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="fecharModal('modalConcluir')">Cancelar</button>
                <button class="btn btn-success" onclick="confirmarConclusao()"><i class="fas fa-check"></i> Concluir</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const hoje = new Date();
        const dataInicio = document.getElementById('dataInicio');
        const dataFim = document.getElementById('dataFim');
        dataInicio.value = hoje.toISOString().slice(0, 10);
        const seteDias = new Date(hoje.getTime() + 7 * 24 * 60 * 60 * 1000);
        dataFim.value = seteDias.toISOString().slice(0, 10);

        let ehAdmin = false;
        let limpezaAtualId = null;

        async function init() {
            await carregarPerfil();
            await carregarColaboradores();
            await carregarLimpezas();
        }

        async function carregarPerfil() {
            try {
                const r = await fetch('/api/facilities/me');
                if (!r.ok) return;
                const d = await r.json();
                ehAdmin = !!d.is_admin;
                if (ehAdmin) document.getElementById('btnNovaLimpeza').style.display = 'inline-flex';
            } catch (e) { /* ignore */ }
        }

        async function carregarColaboradores() {
            const r = await fetch('/api/facilities/colaboradores');
            const d = await r.json();
            const sel = document.getElementById('selColaborador');
            const novaSel = document.getElementById('novaColaborador');
            (d.rows || []).forEach(c => {
                sel.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
                novaSel.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
            });
        }

        async function carregarLimpezas() {
            const di = dataInicio.value;
            const df = dataFim.value;
            const colab = document.getElementById('selColaborador').value;
            let url = `/api/facilities/limpezas?data_inicio=${di}&data_fim=${df}`;
            if (colab) url += `&colaborador_id=${colab}`;
            
            const r = await fetch(url);
            const d = await r.json();
            const grid = document.getElementById('scheduleGrid');
            
            if (!d.rows?.length) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-check"></i><p>Nenhuma limpeza programada para este período.</p></div>`;
                return;
            }

            // Agrupar por data
            const porDia = {};
            d.rows.forEach(l => {
                if (!porDia[l.data_agendada]) porDia[l.data_agendada] = [];
                porDia[l.data_agendada].push(l);
            });

            const diasOrdenados = Object.keys(porDia).sort();${l.concluido ? '' : 'abrirModalConcluir(' + l.id + ')'}">
                                        ${l.concluido ? '<i class="fas fa-check"></i>' : ''}
                                    </div>
                                    <div class="task-info">
                                        <div class="task-title">${l.titulo}</div>
                                        <div class="task-meta">
                                            ${l.local ? l.local + ' • ' : ''}${l.colaborador_nome || 'Sem responsavel'}
                                            ${l.concluido ? `<br><small style="color:#059669"><i class="fas fa-user-check"></i> ${l.concluido_por || '-'} em ${l.concluido_em || ''}</small>` : ''}
                                        </div>
                                    </div>
                                    ${l.hora_inicio ? `<div class="task-time"><i class="fas fa-clock"></i> ${l.hora_inicio}${l.hora_fim ? ' - ' + l.hora_fim : ''}</div>` : ''}
                                    <div class="task-actions">
                                        ${l.tem_evidencia ? `<button class="btn btn-outline btn-sm" onclick="verEvidencia(${l.id})"><i class="fas fa-image"></i></button>` : ''}
                                        ${!l.concluido ? `<button class="btn btn-success btn-sm" onclick="abrirModalConcluir(${l.id})"><i class="fas fa-check"></i> Concluir</button>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function abrirModalNova() {
            document.getElementById('novaTitulo').value = '';
            document.getElementById('novaData').value = hoje.toISOString().slice(0, 10);
            document.getElementById('novaColaborador').value = '';
            document.getElementById('novaHoraInicio').value = '';
            document.getElementById('novaHoraFim').value = '';
            document.getElementById('novaLocal').value = '';
            document.getElementById('novaObs').value = '';
            document.getElementById('modalNova').classList.add('show');
        }

        function fecharModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function salvarNovaLimpeza() {
            const titulo = document.getElementById('novaTitulo').value.trim();
            const data_agendada = document.getElementById('novaData').value;
            if (!titulo) return showToast('Informe o titulo.', 'error');
            if (!data_agendada) return showToast('Informe a data.', 'error');

            const payload = {
                titulo,
                data_agendada,
                colaborador_id: document.getElementById('novaColaborador').value || null,
                hora_inicio: document.getElementById('novaHoraInicio').value || '',
                hora_fim: document.getElementById('novaHoraFim').value || '',
                local: document.getElementById('novaLocal').value.trim(),
                observacoes: document.getElementById('novaObs').value.trim(),
            };
            const r = await fetch('/api/facilities/limpezas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (!r.ok) {
                const d = await r.json().catch(() => ({}));
                showToast(d.error || 'Erro ao agendar (somente admin pode criar).', 'error');
                return;
            }
            showToast('Limpeza agendada!', 'success');
            fecharModal('modalNova');
            carregarLimpezas();
        }

        function abrirModalConcluir(id) {
            limpezaAtualId = id;
            document.getElementById('fotoEvidencia').value = '';
            const preview = document.getElementById('fotoPreview');
            preview.classList.remove('show');
            preview.src = '';
            document.getElementById('modalConcluir').classList.add('show');
        }

        function previewFoto(e) {
            const f = e.target.files?.[0];
            if (!f) return;
            const url = URL.createObjectURL(f);
            const img = document.getElementById('fotoPreview');
            img.src = url;
            img.classList.add('show');
        }

        async function confirmarConclusao() {
            if (!limpezaAtualId) return;
            const f = document.getElementById('fotoEvidencia').files?.[0];
            const fd = new FormData();
            if (f) fd.append('foto', f);
            const r = await fetch(`/api/facilities/limpezas/${limpezaAtualId}/concluir`, { method: 'POST', body: fd });
            if (!r.ok) {
                const d = await r.json().catch(() => ({}));
                showToast(d.error || 'Erro ao concluir.', 'error');
                return;
            }
            showToast('Limpeza concluida!', 'success');
            fecharModal('modalConcluir');
            limpezaAtualId = null;
            carregarLimpezas();
        }

        function verEvidencia(id) {
            window.open(`/api/facilities/limpezas/${id}/evidencia`, '_blank');
        }

        async function marcarConcluido(id, el) {
            abrirModalConcluir(id);       </div>
                `;
            }).join('');
        }

        async function marcarConcluido(id, el) {
            const item = el.closest('.task-item');
            if (item.classList.contains('done')) return; // Já concluído
            
            const r = await fetch(`/api/facilities/limpezas/${id}/concluir`, { method: 'POST' });
            if (r.ok) {
                item.classList.add('done');
                el.innerHTML = '<i class="fas fa-check"></i>';
                showToast('Limpeza marcada como concluída!', 'success');
            } else {
                showToast('Erro ao marcar limpeza.', 'error');
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'times-circle' : 'info-circle'}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        init();
    </script>
</body>
</html>
