<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06070a">
  <title>Consulta de Boletos | Columbia Sync</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon16x16.png?v=20260402-2">
  <link rel="shortcut icon" href="/static/favicon16x16.png?v=20260402-2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #06070a;
      --bg-soft: #111319;
      --panel: rgba(16, 18, 24, .9);
      --panel-2: rgba(20, 24, 32, .78);
      --line: rgba(160, 184, 215, .24);
      --line-strong: rgba(160, 184, 215, .42);
      --text: #eef5ff;
      --muted: #92a3bd;
      --accent: #2f89ff;
      --accent-soft: rgba(47, 137, 255, .2);
      --accent-glow: rgba(47, 137, 255, .45);
      --green: #34d399;
      --green-bg: rgba(52, 211, 153, .16);
      --yellow: #f6c15d;
      --yellow-bg: rgba(246, 193, 93, .16);
      --red: #fb7185;
      --red-bg: rgba(251, 113, 133, .16);
      --radius: 12px;
      --shadow: 0 14px 40px rgba(0, 0, 0, .5);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 460px at 12% -5%, rgba(47, 137, 255, .24), transparent 58%),
        radial-gradient(900px 420px at 90% 3%, rgba(18, 197, 153, .14), transparent 56%),
        linear-gradient(180deg, #090b10 0%, #05060a 100%);
      animation: pageIn .55s ease-out;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(160deg, rgba(15, 18, 25, .95), rgba(8, 9, 13, .98));
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 22px 24px 38px;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      left: -110px;
      top: -330px;
      background: radial-gradient(circle, rgba(47, 137, 255, .34), transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 460px;
      height: 460px;
      right: -170px;
      top: -260px;
      background: radial-gradient(circle, rgba(52, 211, 153, .24), transparent 74%);
      pointer-events: none;
    }
    .wrap { max-width: 1140px; margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 16px;
      background: linear-gradient(130deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid rgba(143, 192, 255, .36);
      box-shadow: 0 14px 26px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(8px);
    }
    .brand-logo {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      background: #fff;
      padding: 8px;
      object-fit: contain;
      box-shadow: 0 0 0 1px rgba(255,255,255,.15), 0 18px 28px rgba(0,0,0,.45);
    }
    .brand-text strong {
      display: block;
      font-size: clamp(24px, 2.4vw, 30px);
      line-height: 1;
      letter-spacing: .02em;
      color: #f4f8ff;
      text-shadow: 0 0 22px rgba(143, 192, 255, .18);
    }
    .brand-text span {
      display: block;
      margin-top: 9px;
      color: #a9cdff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .18em;
    }
    .hero-copy { max-width: 760px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9fc4f6;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.05;
      margin: 0;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #ffffff;
    }
    .main {
      max-width: 1140px;
      margin: -18px auto 0;
      padding: 0 24px 42px;
      position: relative;
      z-index: 2;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .search-card, .results-section {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }
    .search-card { padding: 20px; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .card-head h2 {
      margin: 0 0 5px;
      font-size: 22px;
      color: #f5f9ff;
      font-weight: 800;
    }
    .card-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .shield {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #8fc0ff;
      background: rgba(47, 137, 255, .14);
      border: 1px solid rgba(96, 168, 255, .45);
      font-size: 18px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 4px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      width: fit-content;
      max-width: 100%;
    }
    .btn-tab {
      border: 0;
      background: transparent;
      border-radius: 7px;
      padding: 10px 14px;
      color: #9eb0cb;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .btn-tab.active {
      background: rgba(47, 137, 255, .22);
      color: #ecf4ff;
      box-shadow: inset 0 0 0 1px rgba(143, 192, 255, .5);
    }
    .btn-tab i { margin-right: 6px; }
    .search-form {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, .7fr) minmax(150px, auto);
      gap: 14px;
      align-items: end;
    }
    .search-form label {
      display: block;
      margin-bottom: 7px;
      color: #99acc8;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .search-form input {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(171, 193, 222, .35);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 15px;
      color: var(--text);
      background: rgba(3, 8, 18, .5);
      transition: border-color .16s, box-shadow .16s;
    }
    .search-form input::placeholder { color: #788aa6; }
    .search-form input:focus {
      outline: none;
      border-color: #6eaefc;
      box-shadow: 0 0 0 4px rgba(47,137,255,.2);
    }
    .btn-search {
      min-height: 50px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 22px;
      color: #fff;
      background: linear-gradient(135deg, #277af0, #1f64c5);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(24, 91, 198, .45);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .btn-search:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(24, 91, 198, .5); }
    .btn-search:disabled { opacity: .62; cursor: wait; }
    .btn-search i { margin-right: 7px; }
    .feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .feedback.show { display: flex; gap: 8px; align-items: center; }
    .feedback.error { background: var(--red-bg); color: #fecdd3; border-color: rgba(251,113,133,.45); }
    .feedback.info { background: rgba(47,137,255,.18); color: #cfe5ff; border-color: rgba(47,137,255,.45); }
    .feedback.warning { background: var(--yellow-bg); color: #ffe5a7; border-color: rgba(246,193,93,.45); }
    .loading-spinner {
      display: none;
      margin-top: 18px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: linear-gradient(180deg, rgba(15, 19, 28, .9), rgba(10, 12, 18, .95));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .loading-spinner.show { display: block; }
    .loading-spinner i { color: #84beff; font-size: 28px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .results-section {
      display: none;
      margin-top: 20px;
      padding: 18px;
    }
    .results-section.show { display: block; }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .results-header h3 {
      margin: 0;
      font-size: 20px;
      color: #f4f8ff;
    }
    .results-count {
      display: inline-flex;
      border-radius: 999px;
      padding: 6px 12px;
      background: rgba(47, 137, 255, .22);
      color: #d6eaff;
      border: 1px solid rgba(143, 192, 255, .5);
      font-size: 12px;
      font-weight: 900;
    }
    .boleto-card {
      background: rgba(6, 10, 16, .68);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 10px 18px rgba(0,0,0,.3);
    }
    .boleto-card:hover { border-color: var(--line-strong); }
    .boleto-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .boleto-id {
      font-size: 17px;
      font-weight: 800;
      color: #f3f8ff;
    }
    .boleto-id small {
      display: block;
      margin-top: 4px;
      font-family: "Sora", "Trebuchet MS", sans-serif;
      color: #96a9c5;
      font-size: 12px;
    }
    .cliente-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      color: #d0def3;
      font-size: 12px;
      font-weight: 800;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .status-gerado { background: rgba(47, 137, 255, .2); color: #cfe4ff; }
    .status-pago { background: var(--green-bg); color: #9af0d0; }
    .status-vencido { background: var(--red-bg); color: #ffc5ce; }
    .status-pendente { background: var(--yellow-bg); color: #ffe6af; }
    .boleto-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .boleto-field {
      min-width: 0;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(167, 190, 217, .22);
      border-radius: var(--radius);
      padding: 11px;
    }
    .boleto-field label {
      display: block;
      color: #91a6c4;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 5px;
    }
    .boleto-field span { display: block; font-weight: 800; overflow-wrap: anywhere; }
    .boleto-field .valor { color: #89bfff; font-size: 18px; }
    .boleto-linha {
      background: rgba(47, 137, 255, .08);
      border: 1px dashed rgba(130, 177, 237, .55);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 10px;
    }
    .boleto-linha label {
      display: block;
      color: #9bb0cd;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 6px;
    }
    .linha-valor {
      font-family: "JetBrains Mono", "Courier New", monospace;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-all;
      color: #ddeafd;
    }
    .btn-copy {
      margin-top: 9px;
      border: 1px solid rgba(154, 187, 224, .45);
      border-radius: var(--radius);
      background: rgba(255,255,255,.04);
      color: #d9e9ff;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .boleto-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .boleto-actions .btn-copy { margin-top: 0; }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 0;
      margin-left: 0;
      border: 1px solid #4b9bff;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #2a7cf0, #1e62be);
      color: #fff;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }
    .btn-download:hover { filter: brightness(1.06); }
    .download-unavailable {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(246,193,93,.45);
      border-radius: var(--radius);
      background: rgba(246,193,93,.16);
      color: #ffe1a2;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 900;
    }
    .btn-copy.copied { background: var(--green-bg); color: #9af0d0; border-color: rgba(52,211,153,.45); }
    .grupo-detalhe {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .grupo-label {
      margin-bottom: 8px;
      color: #9aacc7;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .grupo-item {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid rgba(161, 188, 219, .24);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
    }
    .grupo-item-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #edf4ff;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 42px 22px;
      background: rgba(255,255,255,.03);
      border: 1px dashed rgba(161, 188, 219, .34);
      border-radius: var(--radius);
    }
    .empty-state i {
      width: 58px;
      height: 58px;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius);
      background: rgba(47, 137, 255, .2);
      color: #cfe5ff;
      font-size: 24px;
      margin-bottom: 13px;
    }
    .empty-state h3 {
      margin: 0 0 6px;
      color: #f2f8ff;
    }
    .empty-state p { margin: 0; color: var(--muted); }
    .footer {
      text-align: center;
      padding: 24px;
      color: #8ea3c0;
      font-size: 12px;
    }
    .footer a { color: #91c3ff; text-decoration: none; font-weight: 800; }
    @media (max-width: 900px) {
      .portal-grid { grid-template-columns: 1fr; }
      .search-form, .boleto-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .hero { padding: 20px 16px 44px; }
      .topbar { align-items: flex-start; margin-bottom: 32px; }
      .admin-link { display: none; }
      .brand {
        width: 100%;
        padding: 12px;
      }
      .brand-logo {
        width: 72px;
        height: 72px;
      }
      .brand-text strong {
        font-size: 22px;
      }
      .brand-text span {
        font-size: 11px;
        letter-spacing: .14em;
      }
      .main { padding: 0 14px 34px; }
      .search-card, .results-section { padding: 16px; }
      .card-head { align-items: flex-start; }
      .tabs { width: 100%; }
      .btn-tab { flex: 1; }
      .boleto-top, .results-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="/boletos" aria-label="Columbia Sync">
          <img class="brand-logo" src="/static/columbia_sync_logo_v2.png" alt="Columbia Sync">
          <span class="brand-text">
            <strong>Columbia Sync</strong>
            <span>Portal financeiro</span>
          </span>
        </a>
      </div>
      <div class="hero-copy">
        <div class="eyebrow"><i class="fas fa-shield-halved"></i> Consulta segura</div>
        <h1>Boletos em aberto</h1>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="portal-grid">
      <section class="search-card">
        <div class="card-head">
          <div>
            <h2>Localizar boletos</h2>
            <p>Informe CPF/CNPJ, nota fiscal ou orçamento.</p>
          </div>
          <div class="shield"><i class="fas fa-lock"></i></div>
        </div>

        <div class="tabs">
          <button type="button" class="btn-tab active" data-modo="cpf_cnpj" id="tabCpf">
            <i class="fas fa-id-card"></i> CPF / CNPJ
          </button>
          <button type="button" class="btn-tab" data-modo="nota" id="tabNota">
            <i class="fas fa-file-invoice"></i> Número da NF
          </button>
          <button type="button" class="btn-tab" data-modo="orcamento" id="tabOrcamento">
            <i class="fas fa-clipboard-list"></i> Orçamento
          </button>
        </div>

        <form class="search-form" id="searchForm" novalidate>
          <div class="field search-modo" id="modoCpf">
            <label for="cpfCnpj">CPF ou CNPJ</label>
            <input type="text" id="cpfCnpj" name="cpf_cnpj" placeholder="000.000.000-00 ou 00.000.000/0000-00" maxlength="18" autocomplete="off" inputmode="numeric">
          </div>
          <div class="field search-modo" id="modoCpfNota">
            <label for="numeroNotaCpf">NF</label>
            <input type="text" id="numeroNotaCpf" name="numero_nota_cpf" placeholder="11439" maxlength="20" autocomplete="off">
          </div>
          <div class="field search-modo" id="modoNota" style="display:none;">
            <label for="numeroNota">Número da NF</label>
            <input type="text" id="numeroNota" name="numero_nota" placeholder="Ex: 12345" maxlength="20" autocomplete="off">
          </div>
          <div class="field search-modo" id="modoOrcamento" style="display:none;">
            <label for="numeroOrcamento">Nº orçamento</label>
            <input type="text" id="numeroOrcamento" name="orcamento" placeholder="Ex: 45038" maxlength="30" autocomplete="off">
          </div>
          <div class="field search-modo" id="modoValor" style="display:none;">
            <label for="valorNota">Valor opcional</label>
            <input type="text" id="valorNota" name="valor" placeholder="Ex: 1.500,00" autocomplete="off" inputmode="decimal">
          </div>
          <button type="submit" class="btn-search" id="btnSearch">
            <i class="fas fa-search"></i> Consultar
          </button>
        </form>
        <div class="feedback" id="feedback" role="alert"></div>
      </section>
    </div>

    <div class="loading-spinner" id="loading">
      <i class="fas fa-spinner"></i>
      <p style="margin:10px 0 0;font-weight:700;">Consultando boletos...</p>
    </div>

    <section class="results-section" id="resultsSection">
      <div class="results-header">
        <h3><i class="fas fa-file-invoice-dollar" style="color:#8fc0ff;margin-right:6px;"></i> Cobranças em aberto</h3>
        <span class="results-count" id="resultsCount">0 boletos</span>
      </div>
      <div id="resultsList"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Banco do Brasil - Cobranca | Columbia Sync</p>
  </footer>

  <script>
  (function() {
    const form = document.getElementById('searchForm');
    const inputCpf = document.getElementById('cpfCnpj');
    const inputNotaCpf = document.getElementById('numeroNotaCpf');
    const inputNota = document.getElementById('numeroNota');
    const inputOrcamento = document.getElementById('numeroOrcamento');
    const inputValor = document.getElementById('valorNota');
    const btn = document.getElementById('btnSearch');
    const feedback = document.getElementById('feedback');
    const loading = document.getElementById('loading');
    const resultsSection = document.getElementById('resultsSection');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');
    let modoAtual = 'cpf_cnpj';

    document.querySelectorAll('.btn-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.btn-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        modoAtual = this.getAttribute('data-modo');
        document.getElementById('modoCpf').style.display = modoAtual === 'cpf_cnpj' ? '' : 'none';
        document.getElementById('modoCpfNota').style.display = modoAtual === 'cpf_cnpj' ? '' : 'none';
        document.getElementById('modoNota').style.display = modoAtual === 'nota' ? '' : 'none';
        document.getElementById('modoOrcamento').style.display = modoAtual === 'orcamento' ? '' : 'none';
        document.getElementById('modoValor').style.display = modoAtual === 'nota' ? '' : 'none';
        hideFeedback();
      });
    });

    inputCpf.addEventListener('input', function() {
      let v = this.value.replace(/\D/g, '');
      if (v.length <= 11) {
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      } else {
        v = v.substring(0, 14);
        v = v.replace(/^(\d{2})(\d)/, '$1.$2');
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
        v = v.replace(/(\d{4})(\d)/, '$1-$2');
      }
      this.value = v;
    });

    inputValor.addEventListener('input', function() {
      this.value = this.value.replace(/[^\d,]/g, '');
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideFeedback();
      resultsSection.classList.remove('show');
      let body = {};

      if (modoAtual === 'nota') {
        const nota = inputNota.value.trim();
        if (!nota) {
          showFeedback('Informe o número da nota fiscal.', 'error');
          return;
        }
        const valorStr = inputValor.value.replace(/\./g, '').replace(',', '.').trim();
        body = { modo: 'nota', numero_nota: nota, valor: valorStr ? parseFloat(valorStr) : 0 };
      } else if (modoAtual === 'orcamento') {
        const orcamento = inputOrcamento.value.trim();
        if (!orcamento) {
          showFeedback('Informe o número do orçamento.', 'error');
          return;
        }
        body = { modo: 'orcamento', orcamento: orcamento };
      } else {
        const doc = inputCpf.value.replace(/\D/g, '');
        if (!doc || (doc.length !== 11 && doc.length !== 14)) {
          showFeedback('Informe um CPF ou CNPJ válido.', 'error');
          return;
        }
        body = { modo: 'cpf_cnpj', cpf_cnpj: doc, numero_nota: inputNotaCpf.value.trim() };
      }

      loading.classList.add('show');
      btn.disabled = true;
      try {
        const resp = await fetch('/api/boletos/consultar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok || !data.sucesso) {
          showFeedback(data.error || 'Erro ao consultar boletos.', 'error');
          return;
        }
        if (data.total === 0) {
          showFeedback(modoAtual === 'nota' ? 'Nenhuma cobrança em aberto encontrada para esta nota fiscal.' : (modoAtual === 'orcamento' ? 'Nenhuma cobrança em aberto encontrada para este orçamento.' : 'Nenhuma cobrança em aberto encontrada para este CPF/CNPJ.'), 'info');
          renderEmpty();
          return;
        }
        if (data.mensagem) showFeedback(data.mensagem, 'warning');
        renderBoletos(data.boletos || [], data);
      } catch (err) {
        showFeedback('Erro de conexão. Tente novamente.', 'error');
      } finally {
        loading.classList.remove('show');
        btn.disabled = false;
      }
    });

    function renderBoletos(boletos, data) {
      resultsList.innerHTML = '';
      const agrupado = Boolean(data && data.agrupado);
      resultsCount.textContent = agrupado
        ? boletos.length + (boletos.length === 1 ? ' grupo' : ' grupos')
        : boletos.length + (boletos.length === 1 ? ' boleto' : ' boletos');
      resultsSection.classList.add('show');
      if (!boletos.length) {
        renderEmpty();
        return;
      }
      boletos.forEach(function(b) {
        const isGrupo = b.tipo === 'grupo_aberto';
        const qtd = Number(b.quantidade_titulos || 0);
        const titulo = isGrupo ? (b.titulo || 'Títulos em aberto') : (b.nosso_numero ? 'Nosso Nº ' + b.nosso_numero : 'Título em aberto');
        const subtitulos = [];
        if (isGrupo && qtd) subtitulos.push(qtd + (qtd === 1 ? ' título em aberto' : ' títulos em aberto'));
        if (b.numero_nota && !String(titulo).includes(b.numero_nota)) subtitulos.push('NF: ' + b.numero_nota);
        if (b.orcamento && !String(titulo).includes(b.orcamento)) subtitulos.push('Orçamento: ' + b.orcamento);
        const cliente = b.nome_pagador ? '<span class="cliente-line"><i class="fas fa-user"></i> ' + esc(b.nome_pagador) + '</span>' : '';
        const card = document.createElement('div');
        card.className = 'boleto-card';
        card.innerHTML =
          '<div class="boleto-top">' +
            '<div class="boleto-id">' + esc(titulo) +
              (subtitulos.length ? '<small>' + esc(subtitulos.join(' · ')) + '</small>' : '') +
              cliente +
            '</div>' +
            '<span class="status-badge ' + getStatusClass(b.status) + '"><i class="fas fa-circle" style="font-size:6px;"></i> ' + esc(b.status || 'Gerado') + '</span>' +
          '</div>' +
          '<div class="boleto-grid">' +
            '<div class="boleto-field"><label>Valor</label><span class="valor">R$ ' + formatMoney(b.valor) + '</span></div>' +
            '<div class="boleto-field"><label>Vencimento</label><span>' + esc(b.vencimento || '---') + '</span></div>' +
            '<div class="boleto-field"><label>' + (isGrupo ? 'Quantidade' : 'Pagamento') + '</label><span>' + esc(isGrupo ? (qtd || 1) : (b.data_pagamento || '---')) + '</span></div>' +
            '<div class="boleto-field"><label>Banco</label><span>' + esc(b.banco || 'Banco do Brasil') + '</span></div>' +
          '</div>' +
          (isGrupo ? renderGrupoDetalhe(b.titulos || []) : renderAcoesBoleto(b));
        resultsList.appendChild(card);
      });
    }

    function renderGrupoDetalhe(titulos) {
      if (!titulos.length) return '';
      return '<div class="grupo-detalhe"><div class="grupo-label">Boletos do grupo</div>' + titulos.map(function(t) {
        const nome = t.nosso_numero ? 'Nosso Nº ' + t.nosso_numero : (t.documento || t.numero_nota || 'Título em aberto');
        return '<div class="grupo-item">' +
          '<div class="grupo-item-title"><span>' + esc(nome) + '</span><span>R$ ' + formatMoney(t.valor) + '</span></div>' +
          '<div class="boleto-grid">' +
            '<div class="boleto-field"><label>NF</label><span>' + esc(t.numero_nota || '---') + '</span></div>' +
            '<div class="boleto-field"><label>Vencimento</label><span>' + esc(t.vencimento || '---') + '</span></div>' +
            '<div class="boleto-field"><label>Status</label><span>' + esc(t.status || 'Em aberto') + '</span></div>' +
            '<div class="boleto-field"><label>Banco</label><span>' + esc(t.banco || 'Banco do Brasil') + '</span></div>' +
          '</div>' +
          renderAcoesBoleto(t) +
        '</div>';
      }).join('') + '</div>';
    }

    function renderAcoesBoleto(b) {
      const linha = b.linha_digitavel
        ? '<div class="boleto-linha"><label>Linha digitável</label><div class="linha-valor">' + esc(b.linha_digitavel) + '</div></div>'
        : '';
      const actions = [];
      if (b.url_boleto) {
        actions.push('<a class="btn-download" href="' + escAttr(b.url_boleto) + '" target="_blank" rel="noopener"><i class="fas fa-download"></i> Baixar boleto</a>');
      } else if (b.pode_gerar_boleto || b.boleto_gerado || b.nosso_numero) {
        actions.push('<span class="download-unavailable"><i class="fas fa-triangle-exclamation"></i> PDF do boleto indisponível</span>');
      }
      if (b.linha_digitavel) {
        actions.push('<button type="button" class="btn-copy" data-copy="' + escAttr(b.linha_digitavel) + '"><i class="fas fa-copy"></i> Copiar linha digitável</button>');
      }
      if (b.codigo_barras) {
        actions.push('<button type="button" class="btn-copy" data-copy="' + escAttr(b.codigo_barras) + '"><i class="fas fa-barcode"></i> Copiar código de barras</button>');
      }
      if (!actions.length) {
        actions.push('<span class="download-unavailable"><i class="fas fa-circle-info"></i> Boleto em processamento</span>');
      }
      return linha + '<div class="boleto-actions">' + actions.join('') + '</div>';
    }

    function renderEmpty() {
      resultsList.innerHTML = '<div class="empty-state"><i class="fas fa-file-invoice"></i><h3>Nenhum boleto encontrado</h3><p>Confira os dados informados.</p></div>';
      resultsSection.classList.add('show');
      resultsCount.textContent = '0 boletos';
    }

    document.addEventListener('click', function(e) {
      const copyBtn = e.target.closest('.btn-copy');
      if (!copyBtn) return;
      const text = copyBtn.getAttribute('data-copy') || '';
      navigator.clipboard.writeText(text).then(function() {
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copiado';
        setTimeout(function() {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = text.includes(' ') ? '<i class="fas fa-copy"></i> Copiar linha digitável' : '<i class="fas fa-barcode"></i> Copiar código de barras';
        }, 1800);
      });
    });

    function showFeedback(msg, type) {
      feedback.className = 'feedback show ' + type;
      feedback.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle') + '"></i> ' + esc(msg);
    }
    function hideFeedback() { feedback.className = 'feedback'; feedback.innerHTML = ''; }
    function getStatusClass(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('pago') || s.includes('liquid')) return 'status-pago';
      if (s.includes('venc')) return 'status-vencido';
      if (s.includes('pend') || s.includes('registr')) return 'status-pendente';
      return 'status-gerado';
    }
    function formatMoney(v) { return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function escAttr(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  })();
  </script>
</body>
</html>
