<style>
    /* Layout de sistema (padrão ERP): grupos com barra de título, rótulo à
       esquerda e campos em grade. Altura dos campos fica em 38px pra
       continuar dando pra usar no tablet com o dedo. */
    .invc-form { border: 1px solid var(--eui-border-strong); border-radius: 4px; background: var(--eui-surface); overflow: hidden; }
    .invc-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 14px; background: var(--eui-surface-3); border-bottom: 1px solid var(--eui-border-strong); }
    .invc-titlebar h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--eui-text); display: flex; align-items: center; gap: 8px; }
    .invc-titlebar span { font-size: 11.5px; color: var(--eui-muted); }
    .invc-toolbar { display: flex; gap: 6px; padding: 8px 14px; background: var(--eui-surface-2); border-bottom: 1px solid var(--eui-border); }
    .invc-toolbar .eui-btn { border-radius: 3px; }
    .invc-body { padding: 14px; display: grid; gap: 14px; }
    .invc-group { border: 1px solid var(--eui-border); border-radius: 3px; }
    .invc-group-title { margin: 0; padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--eui-text-soft); background: var(--eui-surface-2); border-bottom: 1px solid var(--eui-border); }
    .invc-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; padding: 12px 10px; }
    .invc-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: start; gap: 10px; }
    .invc-row.full { grid-column: 1 / -1; }
    .invc-row > label { padding-top: 10px; font-size: 12px; font-weight: 600; color: var(--eui-text-soft); text-align: right; }
    .invc-row .eui-input { min-height: 38px; border-radius: 3px; font-size: 13px; }
    .invc-row .eui-input[readonly], .invc-row select:disabled { background: var(--eui-surface-2); color: var(--eui-text); }
    .invc-scan { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .invc-scan .eui-btn { border-radius: 3px; min-height: 38px; }
    .invc-hint { font-size: 11.5px; color: var(--eui-muted); min-height: 14px; margin-top: 3px; }
    .invc-hint.ok { color: var(--eui-success-soft-text); }
    .invc-hint.warn { color: var(--eui-danger-soft-text); }
    .invc-req { color: var(--eui-danger-soft-text); }
    /* Varios lotes na mesma contagem: linhas extras abaixo do 1o lote. */
    .invc-lotes { display: grid; gap: 6px; }
    .invc-lote-row { display: grid; grid-template-columns: 28px 1fr 1fr auto; gap: 6px; align-items: center; }
    .invc-lote-row .eui-input { min-height: 38px; border-radius: 3px; }
    .invc-lote-num { font-size: 12px; font-weight: 700; color: var(--eui-muted); text-align: center; }
    .invc-lotes-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .invc-lotes-total { font-size: 12.5px; font-weight: 700; color: var(--eui-text); }
    .inv-status { display: none; margin: 0 14px 14px; padding: 9px 12px; border-radius: 3px; font-size: 12.5px; font-weight: 600; border-left: 3px solid currentColor; }
    .inv-status.show { display: block; }
    .inv-status.ok { background: var(--eui-success-soft); color: var(--eui-success-soft-text); }
    .inv-status.err { background: var(--eui-danger-soft); color: var(--eui-danger-soft-text); }
    .inv-status.info { background: var(--eui-info-soft); color: var(--eui-info-soft-text); }

    .scan-modal { display: none; position: fixed; inset: 0; background: rgba(3, 12, 24, .72); z-index: 11000; align-items: center; justify-content: center; padding: 14px; }
    .scan-modal.open { display: flex; }
    .scan-box { width: min(680px, 100%); background: var(--eui-surface); border-radius: var(--eui-radius-lg); border: 1px solid var(--eui-border); padding: 14px; color: var(--eui-text); }
    .scan-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .scan-head h3 { margin: 0; font-size: 16px; }
    .scan-video-wrap { border: 1px solid var(--eui-border); border-radius: var(--eui-radius); background: #0b1320; overflow: hidden; position: relative; }
    .scan-video { width: 100%; display: block; max-height: 62vh; object-fit: cover; }
    .scan-tip { margin-top: 8px; color: var(--eui-muted); font-size: 12px; }

    @media (max-width: 900px) {
        .invc-rows { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
        .invc-row { grid-template-columns: 1fr; gap: 4px; }
        .invc-row > label { padding-top: 0; text-align: left; }
        .invc-toolbar .eui-btn { flex: 1; }
    }
</style>

<div class="invc-form" style="margin-bottom: 18px;">
    <div class="invc-titlebar">
        <h2><i class="fas fa-clipboard-check"></i> Nova contagem</h2>
        <span>Leitura por câmera disponível no tablet</span>
    </div>
    <div class="invc-toolbar">
        <button type="button" class="eui-btn eui-btn--primary eui-btn--sm" id="inv-salvar"><i class="fas fa-floppy-disk"></i> Salvar</button>
        <button type="button" class="eui-btn eui-btn--subtle eui-btn--sm" id="inv-limpar"><i class="fas fa-eraser"></i> Limpar</button>
    </div>
    <div class="invc-body">
        <section class="invc-group">
            <div class="invc-group-title">Identificação</div>
            <div class="invc-rows">
                <div class="invc-row">
                    <label for="inv-local">Local</label>
                    <div class="invc-scan">
                        <input id="inv-local" class="eui-input" autocomplete="off" placeholder="Opcional" />
                        <button type="button" class="eui-btn eui-btn--subtle" data-scan-target="inv-local"><i class="fas fa-camera"></i> Ler</button>
                    </div>
                </div>
                <div class="invc-row">
                    <label for="inv-codigo">Produto <span class="invc-req">*</span></label>
                    <div class="invc-scan">
                        <input id="inv-codigo" class="eui-input" autocomplete="off" placeholder="Bipe ou digite o código" />
                        <button type="button" class="eui-btn eui-btn--subtle" data-scan-target="inv-codigo"><i class="fas fa-camera"></i> Ler</button>
                    </div>
                </div>
                <div class="invc-row full">
                    <label for="inv-descricao">Descrição</label>
                    <input id="inv-descricao" class="eui-input" readonly tabindex="-1" placeholder="Preenchida pelo GRV" />
                </div>
            </div>
        </section>

        <section class="invc-group">
            <div class="invc-group-title">Contagem</div>
            <div class="invc-rows">
                <div class="invc-row">
                    <label for="inv-unidade">Unidade</label>
                    <div>
                        <select id="inv-unidade" class="eui-input"></select>
                        <div id="inv-unidade-hint" class="invc-hint"></div>
                    </div>
                </div>
                <div class="invc-row">
                    <label for="inv-quantidade" id="inv-quantidade-label">Quantidade <span class="invc-req">*</span></label>
                    <input id="inv-quantidade" class="eui-input" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0" />
                </div>
                <div class="invc-row">
                    <label for="inv-lote"><span id="inv-lote-label">Lote</span> <span id="inv-lote-req" class="invc-req" hidden>*</span></label>
                    <div>
                        <input id="inv-lote" class="eui-input" autocomplete="off" placeholder="Opcional" />
                        <div id="inv-lote-hint" class="invc-hint"></div>
                    </div>
                </div>
                <div class="invc-row full">
                    <label></label>
                    <div>
                        <div id="inv-lotes-extra" class="invc-lotes"></div>
                        <div class="invc-lotes-foot">
                            <button type="button" class="eui-btn eui-btn--subtle eui-btn--sm" id="inv-add-lote"><i class="fas fa-plus"></i> Adicionar lote</button>
                            <span id="inv-lotes-total" class="invc-lotes-total"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="invc-group">
            <div class="invc-group-title">Observações</div>
            <div style="padding: 12px 10px;">
                <textarea id="inv-obs" class="eui-input" rows="3" style="border-radius: 3px;" placeholder="Comentários livres"></textarea>
            </div>
        </section>
    </div>
    <div id="inv-status" class="inv-status"></div>
</div>

<div class="scan-modal" id="scan-modal">
    <div class="scan-box">
        <div class="scan-head">
            <h3><i class="fas fa-camera"></i> Leitura de código de barras</h3>
            <button type="button" class="eui-btn eui-btn--subtle eui-btn--sm" id="scan-fechar"><i class="fas fa-xmark"></i> Fechar</button>
        </div>
        <div class="scan-video-wrap">
            <video id="scan-video" class="scan-video" autoplay playsinline muted></video>
        </div>
        <div class="scan-tip" id="scan-tip">Aponte a câmera para o código. Se seu navegador não suportar leitura nativa, use digitação manual.</div>
    </div>
</div>

<script>
(function () {
    const unidadeSel = document.getElementById('inv-unidade');
    const statusBox = document.getElementById('inv-status');
    const modal = document.getElementById('scan-modal');
    const video = document.getElementById('scan-video');
    const tip = document.getElementById('scan-tip');

    let scanTargetId = null;
    let scanStream = null;
    let rafId = null;
    let detector = null;
    let unidadesPadrao = ['UN'];
    let cadastroAtual = null;   // cadastro do GRV do codigo digitado
    let consultaSeq = 0;
    let consultaTimer = null;

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showStatus(msg, kind = 'info') {
        statusBox.textContent = msg;
        statusBox.className = `inv-status show ${kind === 'ok' ? 'ok' : (kind === 'err' ? 'err' : 'info')}`;
    }

    async function api(url, opts = {}) {
        const resp = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts));
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || data.msg || `HTTP ${resp.status}`);
        return data;
    }

    function preencherUnidades(unidades) {
        const lista = Array.isArray(unidades) && unidades.length ? unidades : ['UN'];
        unidadesPadrao = lista;
        unidadeSel.innerHTML = lista.map((u) => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
    }

    function hint(id, texto, kind = '') {
        const el = document.getElementById(id);
        el.textContent = texto || '';
        el.className = `invc-hint ${kind}`;
    }

    // Unidade e lote seguem o cadastro do GRV. Sem cadastro (codigo novo ou
    // GRV fora do ar) a tela volta a deixar escolher - o servidor faz a
    // mesma regra na hora de salvar, entao nada passa por fora.
    function aplicarCadastro(cad) {
        cadastroAtual = cad;
        document.getElementById('inv-descricao').value = (cad && cad.encontrado && cad.descricao) || '';
        const loteInput = document.getElementById('inv-lote');
        const loteObrig = !!(cad && cad.encontrado && cad.controla_lote);

        if (cad && cad.encontrado && cad.unidade) {
            if (!unidadesPadrao.includes(cad.unidade)) {
                unidadeSel.insertAdjacentHTML('beforeend', `<option value="${esc(cad.unidade)}">${esc(cad.unidade)}</option>`);
            }
            unidadeSel.value = cad.unidade;
            unidadeSel.disabled = true;
            hint('inv-unidade-hint', 'Unidade do GRV', 'ok');
        } else {
            unidadeSel.disabled = false;
            if (!cad) hint('inv-unidade-hint', '');
            else if (cad.disponivel === false) hint('inv-unidade-hint', 'GRV indisponível: confira a unidade manualmente.', 'warn');
            else hint('inv-unidade-hint', 'Código não encontrado no GRV: confira a unidade.', 'warn');
        }

        document.getElementById('inv-lote-req').hidden = !loteObrig;
        loteInput.placeholder = loteObrig ? 'Obrigatório: item controlado por lote' : 'Opcional';
        hint('inv-lote-hint', loteObrig ? 'Item controlado por lote no GRV.' : '', loteObrig ? 'warn' : '');
    }

    async function consultarCadastro() {
        const codigo = (document.getElementById('inv-codigo').value || '').trim();
        const seq = ++consultaSeq;
        if (!codigo) { aplicarCadastro(null); return; }
        hint('inv-unidade-hint', 'Consultando GRV...');
        let cad;
        try {
            cad = await api(`/api/logistica/inventario-inicial/produto?codigo=${encodeURIComponent(codigo)}`);
        } catch (_) {
            cad = { disponivel: false, encontrado: false };
        }
        if (seq === consultaSeq) aplicarCadastro(cad);  // ignora resposta de codigo antigo
    }

    function limparFormulario() {
        document.getElementById('inv-local').value = '';
        document.getElementById('inv-codigo').value = '';
        document.getElementById('inv-quantidade').value = '';
        document.getElementById('inv-lote').value = '';
        document.getElementById('inv-obs').value = '';
        document.getElementById('inv-lotes-extra').innerHTML = '';
        atualizarLotes();
        consultaSeq++;
        aplicarCadastro(null);
        document.getElementById('inv-local').focus();
    }

    // ── Varios lotes na mesma contagem ─────────────────────────────────
    // Os campos Lote/Quantidade de cima sao o 1o lote; cada "Adicionar lote"
    // cria mais uma linha. Com mais de um lote, salva a lista e o servidor
    // grava a soma como quantidade da contagem (a validacao contra o GRV e'
    // so' pelo total).
    function linhasExtras() {
        return Array.from(document.querySelectorAll('#inv-lotes-extra .invc-lote-row'));
    }

    function numero(txt) {
        const n = Number(String(txt || '').trim().replace(',', '.'));
        return Number.isFinite(n) ? n : 0;
    }

    function atualizarLotes() {
        const extras = linhasExtras();
        extras.forEach((row, i) => { row.querySelector('.invc-lote-num').textContent = i + 2; });
        const multi = extras.length > 0;
        document.getElementById('inv-quantidade-label').innerHTML = (multi ? 'Qtde (1º lote)' : 'Quantidade') + ' <span class="invc-req">*</span>';
        document.getElementById('inv-lote-label').textContent = multi ? 'Lote (1º)' : 'Lote';
        const totalEl = document.getElementById('inv-lotes-total');
        if (!multi) { totalEl.textContent = ''; return; }
        let total = numero(document.getElementById('inv-quantidade').value);
        extras.forEach((row) => { total += numero(row.querySelector('[data-lote-qtd]').value); });
        const un = (unidadeSel.value || '').trim();
        totalEl.textContent = `Total contado (${extras.length + 1} lotes): ${total.toLocaleString('pt-BR', { maximumFractionDigits: 3 })} ${un}`;
    }

    function adicionarLote() {
        const box = document.getElementById('inv-lotes-extra');
        box.insertAdjacentHTML('beforeend', `
            <div class="invc-lote-row">
                <span class="invc-lote-num"></span>
                <input class="eui-input" data-lote-nome autocomplete="off" placeholder="Lote" aria-label="Lote">
                <input class="eui-input" data-lote-qtd type="number" min="0" step="0.001" inputmode="decimal" placeholder="Quantidade" aria-label="Quantidade do lote">
                <button type="button" class="eui-btn eui-btn--subtle eui-btn--sm" data-remover-lote title="Remover lote" aria-label="Remover lote"><i class="fas fa-trash"></i></button>
            </div>`);
        atualizarLotes();
        const rows = linhasExtras();
        rows[rows.length - 1].querySelector('[data-lote-nome]').focus();
    }

    async function carregarUnidades() {
        try {
            const data = await api('/api/logistica/inventario-inicial/unidades');
            preencherUnidades(data.unidades || []);
        } catch (err) {
            preencherUnidades(['UN', 'KG', 'L', 'M']);
            showStatus(`Falha ao carregar unidades: ${err.message}`, 'err');
        }
    }

    async function salvarRegistro() {
        const localCodigo = (document.getElementById('inv-local').value || '').trim();
        const codigoProduto = (document.getElementById('inv-codigo').value || '').trim();
        const unidade = (unidadeSel.value || 'UN').trim();
        const quantidadeTxt = (document.getElementById('inv-quantidade').value || '').trim();
        const lote = (document.getElementById('inv-lote').value || '').trim();
        const observacao = (document.getElementById('inv-obs').value || '').trim();
        const extras = linhasExtras();
        if (!codigoProduto) { showStatus('Informe o Cod. Produto.', 'err'); return; }
        if (!quantidadeTxt) { showStatus('Informe a Quantidade.', 'err'); return; }
        if (cadastroAtual && cadastroAtual.controla_lote && !lote) {
            showStatus('Item controlado por lote no GRV: informe o lote.', 'err');
            document.getElementById('inv-lote').focus();
            return;
        }

        const quantidade = Number(String(quantidadeTxt).replace(',', '.'));
        if (!Number.isFinite(quantidade) || quantidade <= 0) {
            showStatus('Quantidade invalida.', 'err');
            return;
        }

        let lotes = null;
        if (extras.length) {
            if (!lote) {
                showStatus('Informe o 1º lote (campo Lote).', 'err');
                document.getElementById('inv-lote').focus();
                return;
            }
            lotes = [{ lote, quantidade }];
            for (const [i, row] of extras.entries()) {
                const nome = (row.querySelector('[data-lote-nome]').value || '').trim();
                const qtd = numero(row.querySelector('[data-lote-qtd]').value);
                if (!nome) { showStatus(`Informe o lote da linha ${i + 2}.`, 'err'); row.querySelector('[data-lote-nome]').focus(); return; }
                if (qtd <= 0) { showStatus(`Quantidade do lote ${nome} deve ser maior que zero.`, 'err'); row.querySelector('[data-lote-qtd]').focus(); return; }
                lotes.push({ lote: nome, quantidade: qtd });
            }
        }

        const btnSalvar = document.getElementById('inv-salvar');
        btnSalvar.disabled = true;
        try {
            await api('/api/logistica/inventario-inicial', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    local_codigo: localCodigo,
                    codigo_produto: codigoProduto,
                    unidade_medida: unidade,
                    quantidade,
                    lote,
                    observacao,
                    ...(lotes ? { lotes } : {}),
                }),
            });
            showStatus('Registro salvo com sucesso.', 'ok');
            limparFormulario();
        } catch (err) {
            showStatus(`Falha ao salvar: ${err.message}`, 'err');
        } finally {
            btnSalvar.disabled = false;
        }
    }

    async function abrirScanner(targetId) {
        scanTargetId = targetId;

        if (!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia) {
            showStatus('Leitura por camera indisponivel neste navegador.', 'err');
            return;
        }

        if (!('BarcodeDetector' in window)) {
            showStatus('Seu navegador nao suporta leitura nativa. Use digitacao manual.', 'info');
            return;
        }

        try {
            detector = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code'] });
        } catch (_) {
            showStatus('Falha ao iniciar leitor de codigo. Use digitacao manual.', 'err');
            return;
        }

        try {
            scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            video.srcObject = scanStream;
            modal.classList.add('open');
            tip.textContent = 'Aponte a camera para o codigo de barras.';
            iniciarLoopScanner();
        } catch (err) {
            showStatus(`Nao foi possivel abrir a camera: ${err.message}`, 'err');
        }
    }

    function pararScanner() {
        if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
        if (scanStream) {
            scanStream.getTracks().forEach((t) => t.stop());
            scanStream = null;
        }
        video.srcObject = null;
        modal.classList.remove('open');
    }

    function iniciarLoopScanner() {
        const loop = async () => {
            if (!detector || !video || video.readyState < 2) {
                rafId = requestAnimationFrame(loop);
                return;
            }
            try {
                const codes = await detector.detect(video);
                if (codes && codes.length) {
                    const code = (codes[0].rawValue || '').trim();
                    if (code && scanTargetId) {
                        const input = document.getElementById(scanTargetId);
                        if (input) {
                            input.value = code;
                            input.dispatchEvent(new Event('input', { bubbles: true }));
                            showStatus(`Codigo lido para ${scanTargetId === 'inv-local' ? 'Local' : 'Cod. Produto'}.`, 'ok');
                        }
                        pararScanner();
                        return;
                    }
                }
            } catch (_) {
                // Mantem loop silencioso para nao gerar ruido.
            }
            rafId = requestAnimationFrame(loop);
        };
        rafId = requestAnimationFrame(loop);
    }

    document.querySelectorAll('[data-scan-target]').forEach((btn) => {
        btn.addEventListener('click', () => abrirScanner(btn.getAttribute('data-scan-target')));
    });

    document.getElementById('scan-fechar').addEventListener('click', pararScanner);
    modal.addEventListener('click', (ev) => {
        if (ev.target === modal) pararScanner();
    });

    const codigoInput = document.getElementById('inv-codigo');
    codigoInput.addEventListener('input', () => {
        clearTimeout(consultaTimer);
        consultaTimer = setTimeout(consultarCadastro, 400);
    });
    codigoInput.addEventListener('change', () => {
        clearTimeout(consultaTimer);
        consultarCadastro();
    });

    document.getElementById('inv-salvar').addEventListener('click', salvarRegistro);
    document.getElementById('inv-add-lote').addEventListener('click', adicionarLote);
    document.getElementById('inv-lotes-extra').addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-remover-lote]');
        if (!btn) return;
        btn.closest('.invc-lote-row').remove();
        atualizarLotes();
    });
    document.getElementById('inv-lotes-extra').addEventListener('input', atualizarLotes);
    document.getElementById('inv-quantidade').addEventListener('input', atualizarLotes);
    document.getElementById('inv-limpar').addEventListener('click', () => {
        limparFormulario();
        showStatus('Formulario limpo.', 'info');
    });

    document.getElementById('inv-obs').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) salvarRegistro();
    });

    carregarUnidades();
})();
</script>
