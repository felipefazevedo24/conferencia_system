<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f62c9">
    <title>Acesso | Columbia Sync</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon16x16.png?v=20260402-2">
    <link rel="shortcut icon" href="/static/favicon16x16.png?v=20260402-2">
    <link rel="apple-touch-icon" href="/static/favicon16x16.png?v=20260402-2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/ui_erp.css?v=20260407-ux1">
    <link rel="stylesheet" href="/static/css/auth_ux.css?v=20260407-1">
</head>
<body class="auth-page">
    <a class="skip-link" href="#login-card">Ir para o login</a>

    <main class="auth-page-shell">
        <div class="auth-shell">
            <section class="login-panel" aria-label="Acesso ao sistema">
                <div id="login-card" class="login-card">
                    <a href="/" class="login-brand" aria-label="Columbia Sync">
                        <div class="brand-logo" aria-hidden="true"></div>
                        <div class="login-brand-text">
                            <span>Columbia</span>
                            <span class="sync">SYNC</span>
                        </div>
                    </a>

                    <h1 class="card-title">Seja bem-vindo de volta!</h1>
                    <p class="card-copy">
                        Use seu usuário para entrar no sistema.
                    </p>

                    <div
                        id="feedback"
                        class="feedback {% if login_message_type %}{{ login_message_type }} show{% endif %}"
                        role="status"
                        aria-live="polite"
                    >
                        {% if login_message %}
                            {{ login_message }}
                        {% endif %}
                    </div>

                    <form id="login-form" novalidate>
                        <div class="field">
                            <label for="user">
                                <span>Usuario</span>
                                <span class="field-note">Seu login interno</span>
                            </label>
                            <div class="input-shell">
                                <input type="text" id="user" name="user" autocomplete="username" placeholder="Digite seu usuario">
                            </div>
                            <div class="field-meta" id="user-meta"></div>
                        </div>

                        <div class="field">
                            <label for="pass">
                                <span>Senha</span>
                                <span class="field-note">Insira sua senha</span>
                            </label>
                            <div class="input-shell has-action">
                                <input type="password" id="pass" name="pass" autocomplete="current-password" placeholder="Digite sua senha">
                                <button type="button" class="field-action" id="toggle-pass" aria-label="Mostrar senha">
                                    <span id="toggle-pass-icon">VER</span>
                                </button>
                            </div>
                            <div class="field-meta" id="pass-meta"></div>
                        </div>

                        <div class="toolbar">
                            <label class="remember">
                                <input type="checkbox" id="remember-user">
                                <span>Lembrar meu usuario neste navegador</span>
                            </label>
                            <span class="field-note" id="caps-lock-hint"></span>
                        </div>

                        <button type="submit" class="login-button" id="login-button">
                            <span class="button-content">
                                <span class="spinner" aria-hidden="true"></span>
                                <span class="button-text">Acessar o painel</span>
                            </span>
                        </button>
                    </form>

                    <div class="footnote">
                        <strong>Segurança:</strong> se você esqueceu sua senha, fale com um administrador do sistema.
                    </div>
                </div>
            </section>

            <section class="brand-panel" aria-label="Contexto visual do sistema">
                <video class="showcase-video" autoplay muted loop playsinline preload="auto">
                    <source src="/static/Home-Page-Hero-Video.mp4" type="video/mp4">
                </video>
            </section>
        </div>
    </main>

    <script>
        const STORAGE_USER_KEY = "columbia_sync_login_user";
        const STORAGE_REMEMBER_KEY = "columbia_sync_login_remember";
        const userInput = document.getElementById("user");
        const passInput = document.getElementById("pass");
        const rememberCheckbox = document.getElementById("remember-user");
        const loginButton = document.getElementById("login-button");
        const loginForm = document.getElementById("login-form");
        const feedback = document.getElementById("feedback");
        const userMeta = document.getElementById("user-meta");
        const passMeta = document.getElementById("pass-meta");
        const capsLockHint = document.getElementById("caps-lock-hint");
        const togglePassButton = document.getElementById("toggle-pass");
        const togglePassIcon = document.getElementById("toggle-pass-icon");

        function setFieldWarning(input, metaTarget, message) {
            input.setAttribute("aria-invalid", "true");
            metaTarget.textContent = message;
            metaTarget.className = "field-meta warning";
        }

        function clearFieldMeta() {
            userInput.removeAttribute("aria-invalid");
            passInput.removeAttribute("aria-invalid");
            userMeta.textContent = "";
            userMeta.className = "field-meta";
            passMeta.textContent = "";
            passMeta.className = "field-meta";
        }

        function showFeedback(type, message, detail = "") {
            feedback.className = `feedback ${type} show`;
            feedback.innerHTML = detail ? `${message}<small>${detail}</small>` : message;
        }

        function setLoading(isLoading) {
            loginButton.disabled = isLoading;
            loginButton.classList.toggle("loading", isLoading);
        }

        function pulseError() {
            const card = document.querySelector(".login-card");
            card.classList.remove("shake");
            void card.offsetWidth;
            card.classList.add("shake");
        }

        function saveRememberedUser() {
            if (rememberCheckbox.checked) {
                localStorage.setItem(STORAGE_REMEMBER_KEY, "1");
                localStorage.setItem(STORAGE_USER_KEY, userInput.value.trim());
                return;
            }

            localStorage.removeItem(STORAGE_REMEMBER_KEY);
            localStorage.removeItem(STORAGE_USER_KEY);
        }

        function hydrateRememberedUser() {
            const shouldRemember = localStorage.getItem(STORAGE_REMEMBER_KEY) === "1";
            const rememberedUser = localStorage.getItem(STORAGE_USER_KEY) || "";
            rememberCheckbox.checked = shouldRemember;

            if (shouldRemember && rememberedUser) {
                userInput.value = rememberedUser;
                passInput.focus();
                return;
            }

            userInput.focus();
        }

        function updateCapsLockState(event) {
            const capsOn = event.getModifierState && event.getModifierState("CapsLock");
            capsLockHint.textContent = capsOn ? "Caps Lock ligado" : "";

            if (!capsOn && passMeta.className === "field-meta warning" && passMeta.textContent.includes("maiusculas")) {
                passMeta.textContent = "";
                passMeta.className = "field-meta";
            }

            if (capsOn) {
                passMeta.textContent = "Atencao: sua senha pode estar sendo digitada em maiusculas.";
                passMeta.className = "field-meta warning";
            }
        }

        togglePassButton.addEventListener("click", () => {
            const showing = passInput.type === "text";
            passInput.type = showing ? "password" : "text";
            togglePassIcon.textContent = showing ? "VER" : "OCULTAR";
            togglePassButton.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
            passInput.focus();
        });

        passInput.addEventListener("keyup", updateCapsLockState);
        passInput.addEventListener("keydown", updateCapsLockState);

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            clearFieldMeta();

            const username = userInput.value.trim();
            const password = passInput.value;

            if (!username || !password) {
                if (!username) {
                    setFieldWarning(userInput, userMeta, "Informe seu usuario para continuar.");
                }

                if (!password) {
                    setFieldWarning(passInput, passMeta, "Informe sua senha para continuar.");
                }

                showFeedback("warning", "Preencha usuario e senha para acessar o sistema.");
                pulseError();
                return;
            }

            setLoading(true);
            saveRememberedUser();
            showFeedback("info", "Validando seu acesso...", "Conectando com o ambiente operacional.");

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.sucesso) {
                    const role = data.user?.role ? `Perfil ${data.user.role}` : "Acesso autorizado";
                    let detail = "Redirecionando voce para o menu principal.";

                    if (data.previous_access_at) {
                        detail = `Ultimo acesso registrado em ${new Date(data.previous_access_at).toLocaleString("pt-BR")}.`;
                    }

                    showFeedback("success", "Login realizado com sucesso.", `${role}. ${detail}`);
                    saveRememberedUser();
                    setTimeout(() => {
                        window.location.href = data.redirect_to || "/";
                    }, 420);
                    return;
                }

                const detail =
                    Number.isFinite(Number(data.retry_after_seconds))
                        ? `Tente novamente em aproximadamente ${Math.ceil(Number(data.retry_after_seconds) / 60)} minuto(s).`
                        : Number.isFinite(Number(data.attempts_left))
                            ? `Tentativas restantes antes do bloqueio: ${Number(data.attempts_left)}.`
                            : "Revise seus dados e tente novamente.";

                passInput.value = "";
                passInput.focus();
                passInput.setAttribute("aria-invalid", "true");
                showFeedback(data.code === "RATE_LIMIT" ? "warning" : "error", data.msg || "Nao foi possivel autenticar.", detail);
                pulseError();
            } catch (error) {
                showFeedback("error", "Falha de comunicacao com o sistema.", "Verifique sua conexao ou tente novamente em alguns instantes.");
                pulseError();
            } finally {
                setLoading(false);
            }
        });

        rememberCheckbox.addEventListener("change", saveRememberedUser);
        userInput.addEventListener("input", () => {
            userInput.removeAttribute("aria-invalid");
            userMeta.textContent = "";
            userMeta.className = "field-meta";

            if (rememberCheckbox.checked) {
                localStorage.setItem(STORAGE_USER_KEY, userInput.value.trim());
            }
        });

        passInput.addEventListener("input", () => {
            passInput.removeAttribute("aria-invalid");
            if (passMeta.className === "field-meta warning" && !passMeta.textContent.includes("maiusculas")) {
                passMeta.textContent = "";
                passMeta.className = "field-meta";
            }
        });

        hydrateRememberedUser();
    </script>
</body>
</html>
