<style>
    .invr-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--eui-border); }
    .invr-field { display: grid; gap: 5px; }
    .invr-field label { font-size: 11px; font-weight: 600; color: var(--eui-text-soft); text-transform: uppercase; letter-spacing: .04em; }
    .invr-field input { min-width: 200px; }
    .invr-table-wrap { overflow-x: auto; }
    .inv-table tr.is-divergente td { background: var(--eui-danger-soft); }
    .inv-badge-div { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
    .inv-badge-div.ok { background: var(--eui-success-soft); color: var(--eui-success-soft-text); }
    .inv-badge-div.divergente { background: var(--eui-danger-soft); color: var(--eui-danger-soft-text); }
    .inv-badge-div.nd { background: var(--eui-surface-3); color: var(--eui-muted); }
    .inv-grv-aviso { margin: 8px 16px 0; font-size: 12px; color: var(--eui-warning); }
    .inv-sync-status { display: none; margin: 10px 16px 0; padding: 10px 12px; border-radius: var(--eui-radius-sm); font-size: 13px; font-weight: 600; }
    .inv-sync-status.show { display: block; }
    .inv-sync-status.ok { background: var(--eui-success-soft); color: var(--eui-success-soft-text); }
    .inv-sync-status.err { background: var(--eui-danger-soft); color: var(--eui-danger-soft-text); }
    .inv-sync-status.info { background: var(--eui-info-soft); color: var(--eui-info-soft-text); }
</style>

<div class="eui-card">
    <div class="eui-card__head">
        <div>
            <h2 class="eui-card__title"><i class="fas fa-magnifying-glass"></i> Inventários realizados</h2>
            <p class="eui-card__sub">Contagens registradas, com o saldo do GRV no momento de cada contagem.</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a class="eui-btn eui-btn--subtle" id="btn-exportar" href="/api/logistica/inventario-inicial/exportar"><i class="fas fa-file-excel"></i> Exportar Excel</a>
            <button class="eui-btn eui-btn--subtle" id="btn-sync-grv" type="button"><i class="fas fa-cloud-arrow-up"></i> Enviar Local para GRV</button>
            <a class="eui-btn eui-btn--subtle" id="btn-json-integracao" href="/api/integracao/inventario/material-local" target="_blank"><i class="fas fa-code"></i> Ver JSON Integração</a>
        </div>
    </div>
    <div class="eui-card__body eui-card__body--tight" style="padding:0;">
        <div class="invr-toolbar">
            <div class="invr-field">
                <label for="flt-local">Local</label>
                <input id="flt-local" class="eui-input" placeholder="Ex.: A01-02" autocomplete="off" />
            </div>
            <div class="invr-field">
                <label for="flt-codigo">Cód. Produto</label>
                <input id="flt-codigo" class="eui-input" placeholder="Ex.: SKU123" autocomplete="off" />
            </div>
            <button class="eui-btn eui-btn--primary" id="btn-filtrar" type="button"><i class="fas fa-filter"></i> Filtrar</button>
            <button class="eui-btn eui-btn--subtle" id="btn-limpar" type="button"><i class="fas fa-eraser"></i> Limpar</button>
        </div>
        <div id="sync-status" class="inv-sync-status"></div>
        <div id="inv-grv-aviso" class="inv-grv-aviso" style="display:none;"></div>
        <div class="invr-table-wrap">
            <table class="erp-table inv-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Local</th>
                        <th>Cód. Produto</th>
                        <th>Unid.</th>
                        <th>Qtd contada</th>
                        <th>Qtd GRV</th>
                        <th>Situação</th>
                        <th>Lote</th>
                        <th>Obs</th>
                        <th>Usuário</th>
                    </tr>
                </thead>
                <tbody id="tb-consulta">
                    <tr><td colspan="10" style="text-align:center;color:var(--eui-muted);padding:14px;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function () {
    const tb = document.getElementById('tb-consulta');
    const fltLocal = document.getElementById('flt-local');
    const fltCodigo = document.getElementById('flt-codigo');
    const btnExportar = document.getElementById('btn-exportar');
    const btnSyncGrv = document.getElementById('btn-sync-grv');
    const btnJsonIntegracao = document.getElementById('btn-json-integracao');
    const syncStatus = document.getElementById('sync-status');

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function paramsAtual() {
        const p = new URLSearchParams();
        if (fltLocal.value.trim()) p.set('local', fltLocal.value.trim());
        if (fltCodigo.value.trim()) p.set('codigo', fltCodigo.value.trim());
        p.set('comparar_grv', '1');
        return p;
    }

    function showSyncStatus(msg, kind) {
        syncStatus.textContent = msg;
        syncStatus.className = `inv-sync-status show ${kind || 'info'}`;
    }

    function atualizarLinkExportar() {
        const p = paramsAtual();
        btnExportar.href = '/api/logistica/inventario-inicial/exportar' + (p.toString() ? `?${p.toString()}` : '');
        const token = new URLSearchParams(window.location.search).get('token') || '';
        btnJsonIntegracao.href = '/api/integracao/inventario/material-local' + (token ? `?token=${encodeURIComponent(token)}` : '');
    }

    function fmtData(iso) {
        if (!iso) return '-';
        try { return new Date(iso).toLocaleString('pt-BR'); } catch (_) { return iso; }
    }

    function fmtQtd(v) {
        return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
    }

    function situacaoHtml(r) {
        if (r.qtde_grv === null || r.qtde_grv === undefined) {
            return '<span class="inv-badge-div nd">N/D no GRV</span>';
        }
        return r.divergente
            ? '<span class="inv-badge-div divergente"><i class="fas fa-triangle-exclamation"></i> Divergente</span>'
            : '<span class="inv-badge-div ok"><i class="fas fa-circle-check"></i> OK</span>';
    }

    function render(rows) {
        if (!rows || !rows.length) {
            tb.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--eui-muted);padding:14px;">Nenhum registro encontrado.</td></tr>';
            return;
        }
        tb.innerHTML = rows.map((r) => `
            <tr class="${r.divergente ? 'is-divergente' : ''}">
                <td>${esc(fmtData(r.criado_em))}</td>
                <td>${esc(r.local_codigo)}</td>
                <td>${esc(r.codigo_produto)}</td>
                <td>${esc(r.unidade_medida)}</td>
                <td>${fmtQtd(r.quantidade)}</td>
                <td>${(r.qtde_grv === null || r.qtde_grv === undefined) ? '—' : fmtQtd(r.qtde_grv)}</td>
                <td>${situacaoHtml(r)}</td>
                <td>${esc(r.lote || '-')}</td>
                <td>${esc(r.observacao || '-')}</td>
                <td>${esc(r.criado_por || '-')}</td>
            </tr>
        `).join('');
    }

    async function buscar() {
        atualizarLinkExportar();
        const p = paramsAtual();
        p.set('limit', '500');
        const url = '/api/logistica/inventario-inicial?' + p.toString();
        const avisoGrv = document.getElementById('inv-grv-aviso');
        try {
            const resp = await fetch(url, { credentials: 'same-origin' });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || data.msg || `HTTP ${resp.status}`);
            render(data.registros || []);
            if (data.sem_grv_no_momento) {
                avisoGrv.style.display = '';
                avisoGrv.innerHTML = `<i class="fas fa-triangle-exclamation"></i> ${data.sem_grv_no_momento} contagem(ns) não conseguiram capturar o saldo do GRV no momento em que foram feitas (API fora do ar naquela hora); a coluna "Qtd GRV" fica vazia pra essas.`;
            } else {
                avisoGrv.style.display = 'none';
            }
        } catch (err) {
            tb.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--eui-danger,#b91c1c);padding:14px;">Erro: ${esc(err.message)}</td></tr>`;
        }
    }

    async function sincronizarGrv() {
        btnSyncGrv.disabled = true;
        showSyncStatus('Sincronizando inventario com API/GRV...', 'info');
        try {
            const resp = await fetch('/api/logistica/inventario-inicial/sincronizar-grv', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.error || data.msg || `HTTP ${resp.status}`);

            const grv = data.grv || {};
            const msg = grv.enviado
                ? `Sincronizado com sucesso. Total: ${data.total || 0}. API GRV atualizada.`
                : `Sincronizado localmente. Total: ${data.total || 0}. ${grv.motivo || grv.erro || 'GRV nao configurado.'}`;
            showSyncStatus(msg, grv.enviado ? 'ok' : 'info');
            await buscar();
        } catch (err) {
            showSyncStatus(`Falha na sincronizacao: ${err.message}`, 'err');
        } finally {
            btnSyncGrv.disabled = false;
        }
    }

    document.getElementById('btn-filtrar').addEventListener('click', buscar);
    btnSyncGrv.addEventListener('click', sincronizarGrv);
    document.getElementById('btn-limpar').addEventListener('click', () => {
        fltLocal.value = '';
        fltCodigo.value = '';
        buscar();
    });
    fltLocal.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') buscar(); });
    fltCodigo.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') buscar(); });

    buscar();
})();
</script>
