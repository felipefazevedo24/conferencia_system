<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Consumo EPI | Columbia Sync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;padding:20px;color:#1e293b}
    .shell{max-width:1000px;margin:0 auto}
    .hero{background:linear-gradient(135deg,#7c3aed,#8b5cf6);border-radius:20px;padding:24px 28px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 32px rgba(124,58,237,.25)}
    .hero i{font-size:32px;opacity:.9}
    .hero h1{font-size:22px;font-weight:800;margin-bottom:4px}
    .hero p{opacity:.88;font-size:13px}
    .filters{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(18,40,58,.04);margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .filters label{font-size:12px;font-weight:600;color:#64748b}
    .filters select,.filters input[type=number]{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;background:#f8fafc}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
    .btn-purple{background:#ede9fe;color:#6d28d9}.btn-purple:hover{background:#ddd6fe}
    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
    .stat{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(18,40,58,.04)}
    .stat .num{font-size:26px;font-weight:800;color:#7c3aed}
    .stat .lbl{font-size:11px;font-weight:600;color:#64748b;margin-top:2px}
    .section{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(18,40,58,.04);overflow:hidden;margin-bottom:16px}
    .section-header{padding:14px 18px;background:#faf5ff;border-bottom:1px solid #ede9fe;display:flex;align-items:center;justify-content:space-between}
    .section-header h2{font-size:15px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:8px}
    .section-header .cnt{background:#7c3aed;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
    table{width:100%;border-collapse:collapse}
    th{background:#f8fafc;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #e2e8f0}
    td{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:13px}
    tr:hover td{background:#fdfbff}
    .bar-wrap{background:#ede9fe;border-radius:4px;height:8px;min-width:60px;flex:1}
    .bar{background:#7c3aed;border-radius:4px;height:100%;transition:width .4s}
    .top-tag{display:inline-block;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:600;color:#6d28d9;margin:2px}
    .empty{text-align:center;padding:40px;color:#94a3b8}
    #periodo{font-size:12px;color:#64748b;margin-left:auto}
    @media(max-width:600px){.hero{flex-direction:column;text-align:center}}
  </style>
  <link rel="stylesheet" href="/static/css/facilities_theme.css?v={{ asset_version|default('1') }}">
</head>
<body>
<div class="shell">
  <div class="hero">
    <i class="fas fa-chart-bar"></i>
    <div style="flex:1">
      <h1>Relatório de Consumo — EPI / Uniformes</h1>
      <p>Retiradas efetivadas agrupadas por setor. Use para planejamento de estoque.</p>
    </div>
  </div>

  <div class="filters">
    <label>Período:</label>
    <select id="filtDias" onchange="load()">
      <option value="30">Últimos 30 dias</option>
      <option value="60">Últimos 60 dias</option>
      <option value="90" selected>Últimos 90 dias</option>
      <option value="180">Últimos 6 meses</option>
      <option value="365">Último ano</option>
    </select>
    <label>Tipo:</label>
    <select id="filtTipo" onchange="load()">
      <option value="">EPI + Uniforme</option>
      <option value="epi">Apenas EPI</option>
      <option value="uniforme">Apenas Uniforme</option>
    </select>
    <button class="btn btn-purple" onclick="load()"><i class="fas fa-sync"></i> Atualizar</button>
    <span id="periodo"></span>
  </div>

  <div class="summary" id="summary"></div>
  <div id="content"></div>
</div>

<script>
  async function load() {
    const dias = document.getElementById('filtDias').value;
    const tipo = document.getElementById('filtTipo').value;
    const params = new URLSearchParams({ dias, tipo });
    const r = await fetch('/api/facilities/relatorio-consumo?' + params);
    if (!r.ok) { document.getElementById('content').innerHTML = '<div class="empty">Erro ao carregar dados.</div>'; return; }
    const d = await r.json();
    render(d);
  }

  function render(d) {
    document.getElementById('periodo').textContent = `Desde ${d.desde} (${d.periodo_dias} dias)`;

    // Resumo
    const maxQtd = Math.max(...(d.por_setor || []).map(s => s.quantidade_total), 1);
    document.getElementById('summary').innerHTML = `
      <div class="stat"><div class="num">${d.total_retiradas}</div><div class="lbl">Retiradas</div></div>
      <div class="stat"><div class="num">${(d.por_setor || []).length}</div><div class="lbl">Setores</div></div>
      <div class="stat"><div class="num">${d.por_setor?.[0]?.setor || '-'}</div><div class="lbl">Maior consumidor</div></div>
      <div class="stat"><div class="num">${d.por_setor?.[0]?.quantidade_total || 0}</div><div class="lbl">Pcs no setor top</div></div>
    `;

    // Tabela por setor
    if (!d.por_setor || !d.por_setor.length) {
      document.getElementById('content').innerHTML = '<div class="empty" style="background:#fff;border-radius:14px;padding:40px"><i class="fas fa-inbox" style="font-size:40px;color:#e2e8f0;display:block;margin-bottom:12px"></i>Nenhuma retirada no período.</div>';
      return;
    }

    document.getElementById('content').innerHTML = `
      <div class="section">
        <div class="section-header">
          <h2><i class="fas fa-building" style="color:#7c3aed"></i>Consumo por Setor</h2>
          <span class="cnt">${d.por_setor.length} setores</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Setor</th>
              <th>Total Peças</th>
              <th>Volume</th>
              <th>Top 5 Itens</th>
            </tr>
          </thead>
          <tbody>
            ${d.por_setor.map((s, i) => `
              <tr>
                <td style="color:#94a3b8;font-weight:700">${i+1}</td>
                <td><strong>${s.setor}</strong></td>
                <td style="font-weight:800;font-size:15px;color:#7c3aed">${s.quantidade_total}</td>
                <td style="min-width:100px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="bar-wrap"><div class="bar" style="width:${Math.round(s.quantidade_total/maxQtd*100)}%"></div></div>
                    <span style="font-size:11px;color:#94a3b8">${Math.round(s.quantidade_total/maxQtd*100)}%</span>
                  </div>
                </td>
                <td>${(s.top_itens || []).map(it => `<span class="top-tag">${it.nome} (${it.qtd})</span>`).join('')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  load();
</script>
</body>
</html>
