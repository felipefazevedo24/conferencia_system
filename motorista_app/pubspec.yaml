name: motorista_app
description: "App do motorista: viagens, paradas e rastreamento em segundo plano confiável."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Estado
  flutter_riverpod: ^3.3.1

  # Rede
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Persistência local (fila de pontos GPS offline + config)
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Rastreamento em segundo plano
  flutter_foreground_task: ^8.17.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
